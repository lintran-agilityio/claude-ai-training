app = "homestay-agent"
primary_region = "sin"

[build]
dockerfile = "Dockerfile.agent"

[env]
NODE_ENV = "production"
PORT = "4111"
MASTRA_DATA_DIR = "/data"
# Set Fly secrets for Clerk auth on the standalone Mastra server:
#   fly secrets set CLERK_PUBLISHABLE_KEY=... CLERK_SECRET_KEY=... CLERK_JWKS_URI=https://<domain>/.well-known/jwks.json

[http_service]
internal_port = 4111
force_https = true
auto_start_machines = true
auto_stop_machines = false
min_machines_running = 1

[[mounts]]
source = "mastra_data"
destination = "/data"