app = "homestay-web"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.web"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

[http_service.concurrency]
    type = "connections"           # "requests"
    soft_limit = 800
    hard_limit = 1000

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512