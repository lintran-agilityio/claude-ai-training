services:
  postgres:
    image: postgres:16-alpine
    container_name: homestay-assistant-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homestay_assistant
    volumes:
      - homestay_postgres_data:/var/lib/postgresql/data

volumes:
  homestay_postgres_data:
